<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bellefair&family=Heebo:wght@300;400&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;background:#0a0908;color:#ece4d6;overflow:hidden;font-family:"Heebo",sans-serif}
#root{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden}
.bg{position:absolute;left:0;top:0;width:100%;height:100%;background-size:cover;background-position:center;transform-origin:50% 50%}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(10,9,8,.45),rgba(10,9,8,.93))}
.txt{position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.5em;padding:0 7vw;text-shadow:0 2px 24px rgba(0,0,0,.7)}
.l{opacity:0;transform:translateY(.35em)}
.big{font:400 min(20vw,17vh)/1 "Bellefair",serif}
.mid{font:400 min(8.4vw,7vh)/1.25 "Bellefair",serif}
.eb{font:400 min(3.6vw,2.6vh) "Heebo";letter-spacing:.4em;color:#c9a96e}
.sm{font:300 min(4.2vw,3vh) "Heebo";color:#b8ae9e;letter-spacing:.08em}
.acc{color:#c9a96e}
.bar{width:0;height:1px;background:linear-gradient(90deg,transparent,#c9a96e,transparent);margin:.5em 0}
</style></head><body><div id="root"></div>
<script>
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const CARDS={
 intro:{bg:"w31-d2",lines:[["eb","ציור · צבע · רגש"],["big","טל לוי"],["bar"],["mid","חזק בצבע. שקט מבפנים."]]},
 soul:{bg:"w05-d2",lines:[["mid","כל ציור"],["mid","הוא פיסה קטנה מהנפש"]]},
 stone:{bg:"w29-d1",lines:[["mid","כל סימן מכחול זו אבן"],["mid acc","גם טעות כבר אינה טעות"]]},
 outro:{bg:"w36-d3",lines:[["big","טל לוי"],["bar"],["mid","38 ציורים מקוריים למכירה"],["sm","אבסטרקט · סוריאליזם · אקספרסיוניזם · תל אביב"]]}
};
let cur;
function build(name,imgdir){cur=CARDS[name];
 root.innerHTML=`<div class="bg" style="background-image:url('${imgdir}/${cur.bg}.jpg')"></div><div class="shade"></div><div class="txt">`+
 cur.lines.map(([c,t])=>c==="bar"?`<div class="bar l"></div>`:`<div class="l ${c}">${t}</div>`).join("")+`</div>`;}
function setT(t,dur){
 document.querySelector(".bg").style.transform=`scale(${1.12+0.09*t/dur})`;
 [...document.querySelectorAll(".l")].forEach((el,i)=>{const s=0.4+i*0.5,p=ease((t-s)/1.0);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*0.35}em)`;
  if(el.classList.contains("bar"))el.style.width=(p*min()*0.28)+"px";});}
function min(){return Math.min(innerWidth,innerHeight*1.4)}
</script></body></html>
