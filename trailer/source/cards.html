<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Frank+Ruhl+Libre:wght@300;500;700&family=Assistant:wght@300;400;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:100%;height:100%;background:#0e0d0c;color:#f3eee4;overflow:hidden;font-family:"Assistant",sans-serif}
#root{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden}
.bg{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 50%;background-size:cover;background-position:center;will-change:transform}
.shade{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(14,13,12,.35),rgba(14,13,12,.85))}
.txt{position:absolute;left:0;top:0;width:100%;height:100%;box-sizing:border-box;text-shadow:0 2px 18px rgba(0,0,0,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:.4em;padding:0 6vw}
.l{font-family:"Frank Ruhl Libre",serif;opacity:0;transform:translateY(.4em)}
.big{font-size:min(19vw,15vh);font-weight:500;line-height:1}
.mid{font-size:min(8.6vw,7.5vh);font-weight:300;line-height:1.25}
.sm{font-family:"Assistant";font-size:min(4.6vw,3.6vh);letter-spacing:0;color:#d8cfbf}
.acc{color:#f97316}
.bar{width:0;height:3px;background:#f97316;margin:.6em 0}
</style></head><body><div id="root"></div>
<script>
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3);
const CARDS={
 intro:{bg:"w08-d1",lines:[["big","טל לוי"],["bar"],["mid","רגשות וצבעים"],["mid","צבעים ורגשות"]]},
 soul:{bg:"w31-d2",lines:[["mid","כל ציור"],["mid","הוא פיסה קטנה מהנפש"]]},
 stone:{bg:"w29-d1",lines:[["mid","כל סימן מכחול זו אבן"],["mid acc","גם טעות כבר אינה טעות"]]},
 outro:{bg:"w36-d3",lines:[["big","טל לוי"],["bar"],["mid","ציורים מקוריים למכירה"],["sm","אבסטרקט · סוריאליזם · אקספרסיוניזם · תל אביב"]]}
};
let cur;
function build(name,imgdir){cur=CARDS[name];
 root.innerHTML=`<div class="bg" style="background-image:url('${imgdir}/${cur.bg}.jpg')"></div><div class="shade"></div><div class="txt">`+
 cur.lines.map(([c,t])=>c==="bar"?`<div class="bar l"></div>`:`<div class="l ${c}">${t}</div>`).join("")+`</div>`;}
function setT(t,dur){ // t seconds
 document.querySelector(".bg").style.transform=`scale(${1.18+0.1*t/dur})`;
 const ls=[...document.querySelectorAll(".l")];
 ls.forEach((el,i)=>{const s=0.35+i*0.45,p=ease((t-s)/0.9);el.style.opacity=p;el.style.transform=`translateY(${(1-p)*0.4}em)`;
  if(el.classList.contains("bar"))el.style.width=(p*120)+"px";});
 const out=ease((t-(dur-0.6))/0.6); root.style.opacity=1-out*0; }
</script></body></html>
